const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryDecrypt(pw){
  const salt=b64(D.s), iv=b64(D.i), ct=b64(D.c);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:D.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(buf);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('e'), btn = document.getElementById('b');
  err.textContent=''; btn.disabled=true; btn.textContent='開いています…';
  try{
    const html = await tryDecrypt(document.getElementById('pw').value.trim());
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent='パスワードが違います。LINEのメッセージをもう一度確かめてください。';
    btn.disabled=false; btn.textContent='開く';
  }
});
