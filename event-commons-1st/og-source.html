<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>OG画像の元｜POOLO COMMONS 1周年パーティー 挑戦のおすそわけ</title>
<link rel="stylesheet" href="../poolo-ds/tokens.css">
<style>
/* OG画像（1200×630）。左に白地の文字、右に写真。写真と文字は重ねない */
html, body { margin: 0; padding: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #fff; font-family: var(--body); color: var(--ink-soft); -webkit-font-smoothing: antialiased; }
.og { display: flex; width: 1200px; height: 630px; }
.txt { flex: none; width: 640px; padding: 64px 64px 56px 72px; display: flex; flex-direction: column; }
.pre { font-family: var(--head); font-weight: 700; font-size: 22px; letter-spacing: 0.08em; color: var(--brand-deep); margin: 0; }
.title { font-family: var(--mincho); font-weight: 700; font-size: 76px; line-height: 1.25; letter-spacing: 0.04em; color: var(--brand-deep); margin: 22px 0 0; }
.catch { font-family: var(--mincho); font-weight: 700; font-size: 25px; line-height: 1.6; letter-spacing: 0.04em; color: var(--ink); margin: 26px 0 0; }
.meta { margin-top: auto; border-top: 2px solid var(--brand); padding-top: 20px; display: flex; align-items: baseline; gap: 22px; }
.d { font-family: var(--en); font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: 0.02em; color: var(--ink); }
.w { font-size: 19px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); line-height: 1.5; }
.w .num { font-family: var(--en); font-weight: 500; }
.ph { flex: 1; min-width: 0; padding: 40px 40px 40px 0; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 45% 50%; }
</style>
</head>
<body>
<div class="og">
  <div class="txt">
    <p class="pre">POOLO COMMONS 1周年パーティー</p>
    <h1 class="title">挑戦の<br>おすそわけ</h1>
    <p class="catch">考えもしなかった挑戦を12個集める、<br>特別な一夜。</p>
    <div class="meta">
      <span class="d">11.01</span>
      <span class="w">日曜日 <span class="num">18:00</span> 開場<br>東京・恵比寿</span>
    </div>
  </div>
  <div class="ph"><img src="images/party_table.jpg" alt=""></div>
</div>
</body>
</html>
