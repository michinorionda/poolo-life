<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG画像の元 — 30代の生き方を問い直す 9/19</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../poolo-ds/tokens.css">
<link rel="stylesheet" href="../poolo-ds/slides.css">
<style>
  /* 書き出し用の台。DSには含めない */
  body { margin: 0; background: #E9ECED; padding: 40px 24px; }
  .note { font-family: var(--body); font-size: 13px; line-height: 1.9; color: rgba(0,0,0,.6); max-width: 1200px; margin: 0 auto 20px; }
</style>
</head>
<body>
<p class="note">書き出し方：Chrome DevTools で下の <code>.og-wrap</code> のノードを選び、右クリック →「Capture node screenshot」。等倍で 1200×630 の PNG になります。<br>
書き出した PNG は <code>images/og.png</code> として置き、index.html の og:image / twitter:image を差し替えてください。</p>
<div class="og-wrap og--photo">
  <div class="og-photo" style="background-image:url(images/03_kominka_dialogue.jpg)"></div>
  <div class="og-panel">
    <div class="og-top">
      <span class="og-brand">POOLO</span>
      <span class="og-date">2026.09.19 20:00</span>
    </div>
    <div class="og-mid">
      <h2 class="og-title">30代の生き方を、<br><em>問い直す</em>90分。</h2>
      <p class="og-sub">あたらしい旅の学校 POOLO・オンライン体験会</p>
    </div>
    <div class="og-foot">
      <span class="og-tag">無料・オンライン</span>
      <span>90分／先着10名</span>
    </div>
  </div>
</div>
</body>
</html>
