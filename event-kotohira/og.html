<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>OG画像（琴平 1泊2日）</title>
<!-- OG画像の元。1200×630で書き出して images/og.png にする。型は poolo-ds の .og--stack（申込がLINEなので中央630×630に主要素を収める） -->
<link rel="stylesheet" href="../poolo-ds/tokens.css">
<link rel="stylesheet" href="../poolo-ds/slides.css">
<style>
html, body { margin: 0; padding: 0; background: #fff; }
/* ブルーのベタ帯は重いので、帯は白地にブルーの文字。写真の下はブルーの細い罫で区切る */
.og--stack .og-photo { flex-basis: 250px; border-bottom: 4px solid var(--brand); background-position: 50% 42%; }
.og--stack .og-body { gap: 10px; }
.og--stack .og-eyebrow { font-size: 15px; }
.og--stack .og-title { font-size: 40px; line-height: 1.42; }
.og--stack .og-band { flex-basis: 74px; background: var(--bg); color: var(--brand); border-top: 1px solid var(--line); margin-inline: 72px; }
.og--stack .og-band-meta { color: var(--ink-72); }
</style>
</head>
<body>
<div class="og-wrap og--stack">
  <div class="og-photo" style="background-image:url(images/bridge_lanterns.jpg)"></div>
  <div class="og-body">
    <p class="og-eyebrow">あたらしい旅の学校 POOLO</p>
    <h2 class="og-title">まだ誰にも話していない<br>「やりたい」を、<br><em>琴平で確かめる。</em></h2>
  </div>
  <div class="og-band">
    <span class="og-band-when">12/20（日）〜21（月）</span>
    <span class="og-band-meta">香川・琴平 1泊2日・定員10名</span>
  </div>
</div>
</body>
</html>
