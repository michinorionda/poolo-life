<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>30s 1080x1080</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../../poolo-ds/tokens.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; background:var(--bg); }
  .art {
    width:1080px; height:1080px;
    display:grid; grid-template-rows:520px 1fr 120px;
    font-feature-settings:"palt" 1;
  }
  .photo { background:url('../../event-30s-v01-260913/images/hero_30s.jpg') center 30% / cover no-repeat; }
  .body {
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:0 76px; text-align:center;
  }
  .eyebrow {
    font-family:var(--mincho); font-weight:600;
    font-size:20px; letter-spacing:.28em; text-indent:.28em;
    color:var(--ink-72); line-height:1.6;
  }
  .title {
    font-family:var(--mincho); font-weight:900;
    font-size:58px; line-height:1.42; letter-spacing:.05em; color:var(--ink);
  }
  .title em { font-style:normal; color:var(--brand); }
  .title .num { font-size:1.32em; letter-spacing:-.02em; margin-inline:.05em; line-height:1; }
  .band {
    background:var(--brand); color:var(--on-brand);
    display:flex; align-items:center; justify-content:center; gap:26px;
  }
  .band .m { font-family:var(--head); font-weight:700; font-size:30px; letter-spacing:.08em; }
  .band .s { font-family:var(--body); font-weight:500; font-size:21px; letter-spacing:.06em; }
</style>
</head>
<body>
<div class="art">
  <div class="photo"></div>
  <div class="body">
    <p class="eyebrow">あたらしい旅の学校 POOLO の体験会</p>
    <h1 class="title"><span class="num">30</span>代の生き方を<br><em>問い直す</em><span class="num">90</span>分。</h1>
  </div>
  <div class="band">
    <span class="m">オンライン（Zoom）・参加無料・先着10名</span>
    <span class="s"></span>
  </div>
</div>
</body>
</html>
